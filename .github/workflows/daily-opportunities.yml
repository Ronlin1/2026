name: Daily Opportunity Tracker

on:
  schedule:
    # GitHub schedules use UTC. These retries run at 08:37, 13:37, and 18:37 Africa/Kampala.
    # The job skips itself after the first successful bot update for the UTC day.
    - cron: "37 5 * * *"
    - cron: "37 10 * * *"
    - cron: "37 15 * * *"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum new opportunities to add"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: daily-opportunity-tracker
  cancel-in-progress: false

jobs:
  update-opportunities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check daily update
        id: daily
        run: |
          today="$(date -u +'%Y-%m-%d')"
          echo "today=$today" >> "$GITHUB_OUTPUT"

          if git log --since="$today 00:00:00 +0000" --author="github-actions[bot]" --fixed-strings --grep="Update opportunities ($today)" --format="%H" | grep -q .; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
            echo "Opportunity tracker already updated for $today."
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.daily.outputs.already_ran != 'true'
        run: python -m unittest discover -s tests -v

      - name: Update README
        if: steps.daily.outputs.already_ran != 'true'
        env:
          MAX_ITEMS: ${{ github.event.inputs.max_items || '5' }}
        run: python scripts/update_opportunities.py --max-items "$MAX_ITEMS"

      - name: Commit README changes
        if: steps.daily.outputs.already_ran != 'true'
        run: |
          if git diff --quiet README.md; then
            echo "No README changes to commit."
            exit 0
          fi

          git config user.name "Ronlin1"
          git config user.email "66623378+Ronlin1@users.noreply.github.com"
          git add README.md
          git commit -m "Update opportunities (${{ steps.daily.outputs.today }})"
          git push
